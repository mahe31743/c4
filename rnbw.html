<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hi Rainbow - 84 Tools - Each Tool Uses AI Tool</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#fff7ed}
header{background:#ff5a8a;color:#fff;padding:16px;text-align:center}
select{padding:10px;font-size:16px;border-radius:8px}
.wrap{max-width:900px;margin:auto;padding:16px}
.card{background:#fff;border:2px solid #eee;border-radius:14px;padding:16px;margin:12px 0}
button{padding:12px 18px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:16px;cursor:pointer;margin:6px 6px 0 0}
button.green{background:#16a34a} button.orange{background:#ea580c} button.pink{background:#db2777}
.q{font-size:22px;font-weight:bold} .opt{display:block;width:100%;text-align:left;background:#f1f5f9;color:#111;margin-top:6px}
.price{font-size:22px;font-weight:bold;color:#16a34a}
</style>
</head>
<body>
<header>
<h1>Hi Rainbow - 84 Tools - Each Tool Uses AI Tool</h1>
<p>English Only - 7 Countries - No Repeat</p>
<select id="country" onchange="changeCountry()">
<option>India</option><option>USA</option><option>UK</option><option>Canada</option><option>Australia</option><option>China</option><option>Korea</option>
</select>
<p id="countryInfo"></p><p class="price" id="priceInfo"></p><p id="payInfo"></p>
</header>
<div class="wrap">
<div class="card">
<h2>Choose Tool - Each Tool Uses Its Own AI Tool</h2>
<button onclick="startTool('math')">Maths Race - AI Math Tool</button>
<button class="green" onclick="startTool('science')">Science Quiz - AI Science Tool</button>
<button class="orange" onclick="startTool('spelling')">Spelling Bee - AI Spelling Tool</button>
<button class="pink" onclick="startTool('reading')">Reading - AI Reading Tool</button>
<button onclick="startTool('drawing')">Drawing - AI Drawing Tool</button>
<p>Each button calls a different AI Tool. No repeat.</p>
</div>
<div class="card" id="quizBox" style="display:none">
<h2 id="quizTitle"></h2>
<p id="aiLabel" style="color:#db2777;font-weight:bold"></p>
<p id="score"></p>
<p class="q" id="question"></p>
<div id="options"></div>
<p id="result"></p>
<button onclick="nextQ()">Next Question - AI Makes New Question</button>
<button onclick="resetTool()">Restart - AI Makes New Set</button>
</div>
<div class="card"><h2>Payment - Changes By Country</h2><p id="payBox"></p><button class="green">Pay Now</button></div>
</div>
<script>
// PRICES - 7 COUNTRIES
var prices={India:{p:"Rs.999",pay:"GPay / PhonePe / UPI"},USA:{p:"$30",pay:"Stripe / PayPal"},UK:{p:"£25",pay:"Stripe / PayPal"},Canada:{p:"$40 CAD",pay:"Stripe / PayPal"},Australia:{p:"$45 AUD",pay:"Stripe / PayPal"},China:{p:"¥200 CNY",pay:"Alipay / WeChat Pay / Stripe"},Korea:{p:"₩40000 KRW",pay:"KakaoPay / Card / Stripe"}};
function changeCountry(){var c=document.getElementById("country").value;document.getElementById("countryInfo").innerText="Country: "+c+" | Language: English Only";document.getElementById("priceInfo").innerText="Price: "+prices[c].p;document.getElementById("payInfo").innerText="Payment: "+prices[c].pay;document.getElementById("payBox").innerText="Country: "+c+" | Price: "+prices[c].p+" | Payment: "+prices[c].pay;}
changeCountry();

// EACH TOOL USES ITS OWN AI TOOL - NO SHARED LIST
var usedQuestions = []; // AI Tool remembers used questions - No Repeat

// AI TOOL 1 - MATH ONLY
function aiMathTool(){
  var bank=[
    {q:"5 + 7 = ?",a:["11","12","13","10"],c:1},
    {q:"10 - 3 = ?",a:["7","8","6","9"],c:0},
    {q:"2 x 4 = ?",a:["6","7","8","9"],c:2},
    {q:"9 + 6 = ?",a:["14","15","16","13"],c:1},
    {q:"20 - 5 = ?",a:["15","14","16","13"],c:0},
    {q:"3 x 3 = ?",a:["8","9","6","12"],c:1},
    {q:"8 + 8 = ?",a:["15","16","14","17"],c:1}
  ];
  return aiPick(bank);
}
// AI TOOL 2 - SCIENCE ONLY
function aiScienceTool(){
  var bank=[
    {q:"What do plants need to grow?",a:["Sunlight and Water","Shoes","Phone","Math Book"],c:0},
    {q:"Which is a living thing?",a:["Rock","Dog","Chair","Table"],c:1},
    {q:"What do we drink to live?",a:["Water","Sand","Stone","Paper"],c:0},
    {q:"Sun gives us?",a:["Light and Heat","Cold","Dark","Ice"],c:0},
    {q:"Which animal says Meow?",a:["Dog","Cat","Cow","Lion"],c:1},
    {q:"Which is a plant?",a:["Rose","Dog","Car","Phone"],c:0}
  ];
  return aiPick(bank);
}
// AI TOOL 3 - SPELLING ONLY
function aiSpellingTool(){
  var bank=[
    {q:"Spell CAT",a:["C-A-T","K-A-T","C-A-T-T","S-A-T"],c:0},
    {q:"Spell APPLE",a:["A-P-L-E","A-P-P-L-E","A-P-L","APPLEE"],c:1},
    {q:"Spell SCHOOL",a:["S-K-O-O-L","S-C-H-O-O-L","S-C-O-O-L","SHOOL"],c:1},
    {q:"Spell RAINBOW",a:["R-A-I-N-B-O-W","R-A-N-B-O-W","R-E-N-B-O","RAINBO"],c:0},
    {q:"Spell DOG",a:["D-O-G","D-O-G-G","DOOG","D-A-G"],c:0},
    {q:"Spell FISH",a:["F-I-S-H","F-I-S","PHISH","FISH-H"],c:0}
  ];
  return aiPick(bank);
}
// AI TOOL 4 - READING ONLY
function aiReadingTool(){
  var bank=[
    {q:"Read: The cat is big. What is big?",a:["Cat","Dog","Fish","Bird"],c:0},
    {q:"Read: I like red apple. What colour?",a:["Red","Blue","Green","Yellow"],c:0}
  ];
  return aiPick(bank);
}
// AI TOOL 5 - DRAWING ONLY
function aiDrawingTool(){
  var bank=[
    {q:"Draw a Sun. What colour is Sun?",a:["Yellow","Blue","Green","Black"],c:0},
    {q:"Draw a Tree. What colour are leaves?",a:["Green","Red","Pink","White"],c:0}
  ];
  return aiPick(bank);
}

// AI PICK - NO REPEAT LOGIC
function aiPick(bank){
  var fresh = bank.filter(function(item){return usedQuestions.indexOf(item.q)===-1;});
  if(fresh.length===0){usedQuestions=[];fresh=bank;}
  var pick = fresh[Math.floor(Math.random()*fresh.length)];
  usedQuestions.push(pick.q);
  return pick;
}

var currentType="math", currentQ=null, currentScore=0, qCount=0;

function startTool(type){
  currentType=type; currentScore=0; qCount=0; usedQuestions=[];
  document.getElementById("quizBox").style.display="block";
  var titles={math:"Maths Race - AI Math Tool",science:"Science Quiz - AI Science Tool",spelling:"Spelling Bee - AI Spelling Tool",reading:"Reading - AI Reading Tool",drawing:"Drawing - AI Drawing Tool"};
  document.getElementById("quizTitle").innerText=titles[type];
  document.getElementById("aiLabel").innerText="AI Tool Active: "+titles[type]+" - Making new question for you... English Only";
  nextQ();
}
function getAIQuestion(){
  if(currentType==="math") return aiMathTool();
  if(currentType==="science") return aiScienceTool();
  if(currentType==="spelling") return aiSpellingTool();
  if(currentType==="reading") return aiReadingTool();
  if(currentType==="drawing") return aiDrawingTool();
}
function nextQ(){
  if(qCount>=5){document.getElementById("question").innerText="AI Tool Finished!";document.getElementById("options").innerHTML="";document.getElementById("result").innerText="";document.getElementById("score").innerText="Final Score: "+currentScore+" / 5 | AI Tool made 5 unique questions, no repeat";return;}
  currentQ=getAIQuestion(); qCount++;
  document.getElementById("score").innerText="Question "+qCount+" of 5 | Score: "+currentScore;
  document.getElementById("question").innerText=currentQ.q;
  document.getElementById("result").innerText="";
  var html="";
  for(var i=0;i<currentQ.a.length;i++){html+='<button class="opt" onclick="checkAns('+i+')">'+currentQ.a[i]+'</button>';}
  document.getElementById("options").innerHTML=html;
}
function checkAns(i){
  if(i===currentQ.c){currentScore++;document.getElementById("result").innerText="Correct! AI Tool says Good Job!";}
  else{document.getElementById("result").innerText="Wrong. AI Tool says Correct answer is: "+currentQ.a[currentQ.c];}
  document.getElementById("score").innerText="Question "+qCount+" of 5 | Score: "+currentScore;
}
function resetTool(){startTool(currentType);}
</script>
</body>
</html>
